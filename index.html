<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Lumins · Sheboygan</title>
<meta name="theme-color" content="#2D7FF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lumins">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3CradialGradient id='g' cx='40%25' cy='35%25' r='75%25'%3E%3Cstop offset='0' stop-color='%23FFF0A8'/%3E%3Cstop offset='1' stop-color='%23F5B731'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='%232D7FF9'/%3E%3Cellipse cx='90' cy='100' rx='52' ry='46' fill='url(%23g)'/%3E%3Cellipse cx='74' cy='94' rx='7' ry='9' fill='%232A2340'/%3E%3Cellipse cx='106' cy='94' rx='7' ry='9' fill='%232A2340'/%3E%3Cpath d='M82 112 Q90 120 98 112' stroke='%232A2340' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M90 22 Q90 40 108 40 Q90 40 90 58 Q90 40 72 40 Q90 40 90 22Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='56' r='36' fill='%23F5B731'/%3E%3Ccircle cx='40' cy='52' r='5' fill='%232A2340'/%3E%3Ccircle cx='60' cy='52' r='5' fill='%232A2340'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#1C2340; --mute:#6B7390; --paper:#F3F6FC; --card:#fff; --line:#E3E8F3;
  --blue:#2D7FF9; --blue2:#1A5FD0; --coral:#FF6B4A; --gold:#FFC83D; --green:#2FBF71; --violet:#8D6CE8;
  --explore:#2D9CDB; --connect:#FF6B4A; --serve:#2FBF71; --reflect:#8D6CE8;
  --navh:66px; --r:20px;
  --shadow:0 6px 20px rgba(28,35,64,.12); --shadow2:0 2px 6px rgba(28,35,64,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;overscroll-behavior:none}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0;letter-spacing:-.005em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:72px}
.muted{color:var(--mute)} .small{font-size:13px} .tiny{font-size:11px} .center{text-align:center} .b{font-weight:800}
.row{display:flex;gap:10px;align-items:center} .between{justify-content:space-between} .wrapf{flex-wrap:wrap} .grow{flex:1;min-width:0}
.gap6{gap:6px}
.btn{display:block;width:100%;background:var(--blue);color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;padding:14px 18px;border-radius:16px;box-shadow:0 4px 0 var(--blue2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue2)}
.btn:disabled{opacity:.55}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 #D9472A}
.btn.gold{background:var(--gold);color:#3A2A00;box-shadow:0 4px 0 #D9A21E}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sm{display:inline-block;width:auto;font-size:14px;padding:8px 13px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:13px;font-weight:800;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.label{font-family:Fredoka,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:22px 2px 9px}
.panel{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow2)}
.bar{height:10px;background:#E8EDF7;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9F43);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.blue>i{background:linear-gradient(90deg,#5AA2FF,var(--blue))}
.bar.big{height:16px}
.ava{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:25px;flex:none;box-shadow:var(--shadow2);border:3px solid #fff}
.ava.s{width:34px;height:34px;font-size:18px;border-width:2px}
.ava.l{width:72px;height:72px;font-size:40px}
.empty{text-align:center;padding:22px 10px;color:var(--mute)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:2px;opacity:.25}
.dot.on{opacity:1}

/* ===== MAP ===== */
#map{position:fixed;inset:0;bottom:var(--navh);z-index:1;background:#dfe9f3}
.osm-tiles{filter:saturate(.75) brightness(1.04)}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
.pin{position:relative;width:46px;height:46px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:#fff;border:4px solid var(--kc,var(--blue));box-shadow:0 6px 14px rgba(28,35,64,.25);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-size:21px}
.pin.done{opacity:.55;filter:saturate(.4)}
.pin.done:after{content:"✓";position:absolute;transform:rotate(45deg);right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.pin:not(.done){animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-45deg) translate(2px,-2px)}}
.me-dot{width:22px;height:22px;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:0 0 0 0 rgba(45,127,249,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 18px rgba(45,127,249,0)}100%{box-shadow:0 0 0 0 rgba(45,127,249,0)}}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#hud>*{pointer-events:auto}
.hudcard{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:7px 12px 7px 7px;display:flex;align-items:center;gap:9px}
.lvchip{font-family:Fredoka,sans-serif;font-weight:700;font-size:12px;color:var(--blue)}
.beaconpill{margin-left:auto;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:8px 12px;font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.beaconpill .bar{width:60px;height:7px}
#mapdock{position:fixed;left:0;right:0;bottom:calc(var(--navh) + 12px);z-index:5;padding:0 12px;display:flex;flex-direction:column;gap:10px;align-items:stretch;pointer-events:none}
#mapdock>*{pointer-events:auto}
.fabs{display:flex;gap:10px;justify-content:flex-end}
.fab{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:24px;position:relative}
.fab em{position:absolute;top:-3px;right:-3px;background:var(--coral);color:#fff;font-style:normal;font-size:11px;font-weight:900;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.fab.on{background:var(--ink);color:#fff}
.waiting{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#FFE27A,#FFB347);border-radius:22px;padding:10px 16px 10px 10px;box-shadow:0 8px 24px rgba(255,170,40,.45);font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;color:#3A2A00;animation:glow 1.6s ease-in-out infinite}
.waiting .mini{width:48px;height:48px;flex:none;animation:hop 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 34px rgba(255,170,40,.75)}}
@keyframes hop{50%{transform:translateY(-4px)}}
.leaderbanner{background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;text-align:center;box-shadow:var(--shadow)}

/* ===== PAGES ===== */
#page{position:fixed;inset:0;bottom:var(--navh);z-index:8;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper)}
#page .wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 28px}
.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pagehead h1{font-size:30px}

/* quests */
.quest{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border-radius:18px;padding:12px;margin-bottom:9px;box-shadow:var(--shadow2);position:relative;overflow:hidden}
.quest:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pc)}
.quest:active{transform:scale(.985)}
.quest.cool{opacity:.5}
.qic{font-size:24px;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;flex:none;background:color-mix(in srgb,var(--pc) 14%,#fff)}
.qt{font-weight:800;line-height:1.25}
.qd{font-size:13px;color:var(--mute);margin-top:2px;line-height:1.3}
.qxp{margin-left:auto;text-align:right;flex:none;font-family:Fredoka,sans-serif;font-weight:600;color:var(--blue)}
.qxp small{display:block;font-family:Nunito;font-weight:800;font-size:11px;color:var(--pc)}
.bonus{display:inline-block;background:var(--gold);color:#3A2A00;font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px;margin-left:5px;vertical-align:2px}
.pexplore{--pc:var(--explore)} .pconnect{--pc:var(--connect)} .pserve{--pc:var(--serve)} .preflect{--pc:var(--reflect)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.daily{background:linear-gradient(135deg,#2D7FF9,#7B5CFA);color:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.daily .quest{box-shadow:none;color:var(--ink)}

/* crew */
.crewcard{background:linear-gradient(135deg,#FF8A5B,#FF5E7E);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.crewcard:after{content:attr(data-emoji);position:absolute;right:-10px;top:-14px;font-size:110px;opacity:.18}
.crewcard h2{font-size:26px}
.member{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;text-align:center}
.member .n{font-size:12px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68px}
.member button{background:rgba(255,255,255,.25);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:800;color:#fff}
.hunt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
.hunt:last-child{border:0}
.hunt .chk{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;font-size:16px}
.hunt.found .chk{background:var(--green);border-color:var(--green);color:#fff}
.hunt.found .ht{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:#eee}
.post{padding:13px 0;border-bottom:1px solid var(--line)}
.post:last-child{border:0}
.post .photo{width:100%;border-radius:16px;margin-top:9px;max-height:380px;object-fit:cover;background:#eef}
.post .note{background:var(--paper);border-radius:12px;padding:8px 11px;margin-top:7px;font-size:14px}
.cheer{font-size:13px;font-weight:800;color:var(--mute)}
.cheer.done{color:var(--coral)}
.listrow{display:flex;align-items:center;gap:11px;padding:8px 0}
.rank{width:22px;text-align:center;font-family:Fredoka;font-weight:700;color:var(--mute)}
.hearts{color:var(--coral);letter-spacing:1px;font-size:12px}
.bell{position:relative;font-size:24px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--shadow2);display:grid;place-items:center}
.bell em{position:absolute;top:-2px;right:-2px;background:var(--coral);color:#fff;font-style:normal;font-size:11px;font-weight:900;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}

/* dex */
.lineblock{background:#fff;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow2)}
.dexrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mon{border-radius:16px;padding:6px 4px 9px;text-align:center;background:color-mix(in srgb,var(--lc) 13%,#fff);position:relative}
.mon .art{width:100%;aspect-ratio:1}
.mon .nm{font-family:Fredoka;font-weight:600;font-size:13px;line-height:1.1}
.mon .qty{position:absolute;top:6px;right:6px;background:#fff;border-radius:99px;font-size:10px;font-weight:900;padding:1px 6px}
.mon.sil{background:#F0F2F7}
.mon.sil .art svg{filter:brightness(0) opacity(.13)}
.mon.sil .nm{color:#B3B9CC}
.grow-btn{margin-top:5px;font-size:11px;font-weight:900;color:#fff;background:var(--green);border-radius:99px;padding:3px 8px;display:inline-block;animation:glow2 1.4s infinite}
@keyframes glow2{50%{box-shadow:0 0 0 4px rgba(47,191,113,.25)}}
.sparkpill{font-family:Fredoka;font-weight:600;font-size:14px;color:#B7860B;background:#FFF5D6;border-radius:99px;padding:4px 10px}
.virtue{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--lc)}

/* me */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border-radius:16px;padding:10px 4px;text-align:center;box-shadow:var(--shadow2)}
.stat b{display:block;font-family:Fredoka;font-weight:600;font-size:21px}
.stat span{font-size:11px;color:var(--mute);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{text-align:center;background:#fff;border-radius:16px;padding:10px 3px;box-shadow:var(--shadow2)}
.badge .e{font-size:28px} .badge .n{font-size:11px;font-weight:800;margin-top:3px;line-height:1.15}
.badge.off{opacity:.35;filter:grayscale(1)}
.avpick{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.avpick button{font-size:23px;padding:5px 0;border-radius:11px;background:var(--paper)}
.avpick button.on{background:var(--gold)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
.sw{width:52px;height:31px;border-radius:99px;background:#D5DBE8;position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)} .sw.on:after{left:24px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;z-index:20;box-shadow:0 -4px 18px rgba(28,35,64,.08)}
nav .in{max-width:560px;margin:0 auto;height:var(--navh);display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:Fredoka;font-weight:600;font-size:11px;color:#9AA2BC;position:relative}
nav button span{font-size:23px;filter:grayscale(1) opacity(.6);transition:transform .15s}
nav button.on{color:var(--blue)} nav button.on span{filter:none;transform:translateY(-2px) scale(1.12)}
nav button em{position:absolute;top:7px;left:calc(50% + 6px);background:var(--coral);color:#fff;font-style:normal;font-size:10px;font-weight:900;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
body{padding-bottom:var(--navh)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.open{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(20,24,45,.45);animation:fade .2s}
.sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:14px 18px calc(26px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet .box .in{max-width:540px;margin:0 auto}
.grab{width:46px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}} @keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:12px 18px;border-radius:16px;z-index:90;max-width:92vw;text-align:center;animation:drop .25s;box-shadow:var(--shadow)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.photopick{display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:16px;padding:10px;cursor:pointer}
.photopick img{width:56px;height:56px;border-radius:10px;object-fit:cover;display:none}
.photopick.has img{display:block}
.qrbox{background:#fff;border-radius:22px;padding:16px;display:grid;place-items:center;box-shadow:var(--shadow2);border:2px solid var(--line);width:max-content;margin:0 auto}
.code{font-family:Fredoka;font-weight:700;font-size:34px;letter-spacing:.18em;text-align:center;color:var(--blue)}

/* catch */
#catch{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 42%,var(--cb1,#FFF4C9) 0%,var(--cb2,#7FB6FF) 75%);overflow:hidden}
#catch.open{display:flex}
#catch .ctop{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-family:Fredoka;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.2)}
#catch .cx{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.3);color:#fff;font-size:18px}
.cstage{position:relative;width:min(300px,78vw);aspect-ratio:1;cursor:pointer;flex:none}
.cmon{position:absolute;inset:12%;animation:float 2.2s ease-in-out infinite;transition:transform .35s ease-in,opacity .35s}
.cmon.in{transform:scale(0) translateY(40px);opacity:0}
@keyframes float{50%{transform:translateY(-10px)}}
.cring{position:absolute;left:50%;top:52%;width:86%;height:86%;border-radius:50%;border:5px solid #fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 18px rgba(255,255,255,.6)}
.corb{position:absolute;left:50%;bottom:-160px;width:58px;height:58px;margin-left:-29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#FFE48A 35%,#FFB020 70%,#E08A00 100%);box-shadow:0 0 26px rgba(255,200,60,.9);opacity:0;transition:bottom .45s cubic-bezier(.3,1.3,.6,1),transform .45s,opacity .1s}
.corb.fly{bottom:42%;opacity:1}
.corb.wob{animation:wob .6s ease-in-out 3}
@keyframes wob{25%{transform:rotate(-22deg)}75%{transform:rotate(22deg)}}
.corb.burst{animation:burst .5s forwards}
@keyframes burst{to{transform:scale(2.4);opacity:0}}
.cname{font-family:Fredoka;font-weight:700;font-size:30px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.2);text-align:center}
.cstars{color:#fff;text-align:center;font-size:15px;opacity:.95}
.cthrow{width:100%;max-width:420px}
.chit{font-family:Fredoka;font-weight:700;font-size:40px;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.25);position:absolute;left:0;right:0;top:12%;text-align:center;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}}
.result{background:#fff;border-radius:28px;padding:18px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:up .35s cubic-bezier(.2,.9,.3,1);text-align:center}
.result .art{width:150px;height:150px;margin:-80px auto 0;animation:pop .6s}
.newtag{display:inline-block;background:var(--coral);color:#fff;font-weight:900;font-size:12px;border-radius:8px;padding:3px 8px;margin-bottom:4px}
.confetti{position:fixed;top:-20px;z-index:95;pointer-events:none;font-size:20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* join */
.join{min-height:100%;background:linear-gradient(180deg,#2D7FF9 0%,#7B5CFA 55%,var(--paper) 55.1%);padding:calc(26px + env(safe-area-inset-top)) 16px 30px}
.join .wrap{max-width:480px;margin:0 auto}
.starter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.starter button{background:var(--paper);border-radius:18px;padding:6px 4px 10px;border:3px solid transparent;text-align:center}
.starter button.on{border-color:var(--blue);background:#EAF2FF}
.starter .art{width:100%;aspect-ratio:1}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#2D7FF9,#7B5CFA);color:#fff;text-align:center;z-index:100}
.splash .art{width:120px;height:120px;margin:0 auto;animation:float 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<div id="hud" hidden></div>
<div id="mapdock" hidden></div>
<div id="page" hidden><div class="wrap" id="pageBody"></div></div>
<nav id="nav" hidden><div class="in">
  <button data-tab="map"><span>🗺️</span>Map</button>
  <button data-tab="quests"><span>📜</span>Quests</button>
  <button data-tab="crew"><span>🧭</span>Crew</button>
  <button data-tab="dex"><span>📖</span>Lumidex</button>
  <button data-tab="me"><span>🙂</span>Me</button>
</div></nav>
<div id="sheet" class="sheet"><div class="scrim"></div><div class="box"><div class="in"><div class="grab"></div><div id="sheetBody"></div></div></div></div>
<div id="catch"></div>
<div id="splash" class="splash"><div><div class="art" id="splashArt"></div><h1 style="font-size:34px;margin-top:10px">Lumins</h1><p style="opacity:.85;margin:4px 0 0">Waking up the Lumins…</p></div></div>

<script>
/* ============ CONFIG — paste from Supabase → Settings → API ============ */
const SUPABASE_URL = 'https://sjwarllnehssyphoormc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_eGv0iwOKZ1DP6JixaXZnrQ_vI6nax4S';
/* ====================================================================== */

const configured = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'ysa' } }) : null;

/* ---------- game data ---------- */
const LINES = {
  glim:   { virtue: 'Hope',      c: ['#FFF0A8', '#F5B731'] },
  seed:   { virtue: 'Faith',     c: ['#CDF5B8', '#3FA34D'] },
  drip:   { virtue: 'Renewal',   c: ['#C9EBFF', '#2F8FE0'] },
  pebble: { virtue: 'Steadfast', c: ['#F1E7D8', '#9A8670'] },
  wisp:   { virtue: 'Peace',     c: ['#ECE3FF', '#8D6CE8'] },
  finch:  { virtue: 'Joy',       c: ['#FFD7D0', '#F06A5D'] },
  lamp:   { virtue: 'Kindness',  c: ['#FFE0BC', '#F0832D'] },
  shore:  { virtue: 'Belonging', c: ['#C6FAEE', '#1FAE9A'] }
};
const LINE_ORDER = ['glim', 'seed', 'drip', 'pebble', 'wisp', 'finch', 'lamp', 'shore'];
const PATHS = {
  explore: { name: 'Explore', emoji: '🧭' }, connect: { name: 'Connect', emoji: '💬' },
  serve:   { name: 'Serve',   emoji: '🤲' }, reflect: { name: 'Reflect', emoji: '🌙' }
};
const ENERGY = { 1: 'Solo', 2: 'Small group', 3: 'Big group' };
const BATTERY = { low: { label: '🪫 Low-key', max: 1 }, mid: { label: '🔋 A few people', max: 2 }, full: { label: '⚡ Bring it on', max: 3 } };
const KINDS = {
  lake: { n: 'Lakeshore', c: '#2D9CDB' }, park: { n: 'Park', c: '#2FBF71' }, town: { n: 'Downtown', c: '#FF6B4A' },
  quiet: { n: 'Quiet spot', c: '#8D6CE8' }, gather: { n: 'Gathering place', c: '#FFB020' }
};
const AVATARS = ['🙂','😎','🤠','🦊','🐻','🦉','🐢','🦁','🐼','🐙','🌻','🌵','🍀','⭐','🌙','☀️','🔥','🌊','🎸','🎮','📚','🏀','⚽','🎨'];
const TITLES = ['Rookie','Wanderer','Scout','Explorer','Trailblazer','Pathfinder','Navigator','Lightkeeper','Guide','Legend'];
const HIFIVES = ["Glad you're here 💛", 'High five! 🙌', "You've got this 💪", 'Saw your post — love it ✨', 'Hang out this week? 🍕'];
const FRIEND_LV = [[15, 'Best friends', 4], [7, 'Good friends', 3], [3, 'Friends', 2], [1, 'Acquaintances', 1]];
const QUALITY = ['Nice!', 'Great!', 'Excellent!'];

const S = {
  tab: 'map', uid: null, user: null, me: null, home: null, players: [], quests: [], spots: [], species: [], dex: [], sparks: [],
  acts: [], meets: [], inbox: [], pending: [], events: [], feed: null, cheered: new Set(),
  battery: lsGet('battery') || 'mid', qpath: 'all', map: null, layer: null, meMarker: null, pos: null, addSpot: false
};

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function lsGet(k) { try { return localStorage.getItem('lum_' + k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem('lum_' + k, v); } catch (e) {} }
function toast(msg, ms = 2800) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function errMsg(e) { return (e && (e.message || e.error_description)) || 'Something went wrong'; }
function tz() { return (S.home && S.home.timezone) || 'America/Chicago'; }
function localDate(ts) { return new Date(ts).toLocaleDateString('en-CA', { timeZone: tz() }); }
function dnum(d) { const [y, m, dd] = d.split('-').map(Number); return Date.UTC(y, m - 1, dd) / 864e5; }
function weekStart(d) { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() - x.getUTCDay()); return x.toISOString().slice(0, 10); }
function shiftWeek(d, n) { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + 7 * n); return x.toISOString().slice(0, 10); }
function ago(ts) { const s = (Date.now() - new Date(ts)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }
function when(ts) { return new Date(ts).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
function levelInfo(xp) { const lv = Math.floor(Math.sqrt(xp / 60)) + 1; const cur = 60 * (lv - 1) ** 2, next = 60 * lv ** 2; return { lv, title: TITLES[Math.min(lv - 1, TITLES.length - 1)], pct: Math.round((xp - cur) / (next - cur) * 100), toNext: next - xp }; }
function player(id) { return S.players.find(p => p.id === id) || { display_name: 'Someone', avatar: '🙂' }; }
function species(id) { return S.species.find(s => s.id === id); }
function owned(id) { const d = S.dex.find(x => x.species_id === id); return d ? d.qty : 0; }
function sparksFor(line) { const s = S.sparks.find(x => x.line === line); return s ? s.qty : 0; }
function friendLevel(days) { return FRIEND_LV.find(f => days >= f[0]) || FRIEND_LV[3]; }
function distM(a, b) { const R = 6371000, t = x => x * Math.PI / 180; const dLa = t(b.lat - a.lat), dLo = t(b.lng - a.lng); const h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m'; }
function confetti(n = 30) { const e = ['✨', '⭐', '💛', '🎉', '💫']; for (let i = 0; i < n; i++) { const c = document.createElement('div'); c.className = 'confetti'; c.textContent = e[i % e.length]; c.style.left = Math.random() * 100 + 'vw'; c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's'; c.style.animationDelay = Math.random() * .4 + 's'; document.body.appendChild(c); setTimeout(() => c.remove(), 4400); } }
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').classList.add('open'); $('#sheet .box').scrollTop = 0; }
function closeSheet() { $('#sheet').classList.remove('open'); }
$('#sheet .scrim').onclick = closeSheet;
function bindSw(root) { root.querySelectorAll('.sw').forEach(s => s.onclick = () => s.classList.toggle('on')); }

/* ---------- Lumin art (procedural SVG) ---------- */
let svgN = 0;
function star(x, y, r) { return `M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r}Z`; }
function lumiSVG(line, stage) {
  const L = LINES[line] || LINES.glim, [c1, c2] = L.c, id = 'lg' + (++svgN);
  const cx = 60, cy = 74, rx = 21 + stage * 5, ry = 19 + stage * 4.5, top = cy - ry;
  const F = `url(#${id})`;
  let back = '', front = '';
  if (stage === 3) back += `<circle cx="60" cy="68" r="56" fill="url(#${id}a)"/>`;
  switch (line) {
    case 'glim':
      front += `<path d="${star(cx, top - 9, 9 + stage)}" fill="#fff" stroke="${c2}" stroke-width="2"/>`;
      if (stage >= 2) front += `<path d="${star(cx - rx - 4, top + 6, 5)}" fill="${c2}"/><path d="${star(cx + rx + 4, top + 6, 5)}" fill="${c2}"/>`;
      if (stage === 3) for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; back += `<line x1="${cx + Math.cos(a) * (rx + 8)}" y1="${cy + Math.sin(a) * (ry + 8)}" x2="${cx + Math.cos(a) * (rx + 18)}" y2="${cy + Math.sin(a) * (ry + 18)}" stroke="${c2}" stroke-width="4" stroke-linecap="round" opacity=".7"/>`; }
      break;
    case 'seed':
      back += `<path d="M${cx} ${top + 4} Q${cx + 2} ${top - 8} ${cx} ${top - 16}" stroke="${c2}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
      back += `<ellipse cx="${cx + 8}" cy="${top - 13}" rx="9" ry="4.5" fill="${c2}" transform="rotate(-30 ${cx + 8} ${top - 13})"/>`;
      if (stage >= 2) back += `<ellipse cx="${cx - 8}" cy="${top - 9}" rx="9" ry="4.5" fill="${c2}" transform="rotate(30 ${cx - 8} ${top - 9})"/>`;
      if (stage === 3) back = `<circle cx="60" cy="68" r="56" fill="url(#${id}a)"/><circle cx="${cx}" cy="${top - 14}" r="16" fill="${c2}"/><circle cx="${cx - 16}" cy="${top - 4}" r="12" fill="${c2}"/><circle cx="${cx + 16}" cy="${top - 4}" r="12" fill="${c2}"/><circle cx="${cx - 6}" cy="${top - 20}" r="5" fill="${c1}" opacity=".6"/>`;
      break;
    case 'drip':
      back += `<path d="M${cx - rx * .62} ${top + ry * .55} Q${cx - 2} ${top - 6 - stage * 4} ${cx} ${top - 12 - stage * 5} Q${cx + 2} ${top - 6 - stage * 4} ${cx + rx * .62} ${top + ry * .55}Z" fill="${F}"/>`;
      if (stage >= 2) front += `<circle cx="${cx + rx + 6}" cy="${top + 4}" r="4" fill="${c1}" stroke="${c2}" stroke-width="1.5"/><circle cx="${cx + rx + 12}" cy="${top - 6}" r="2.5" fill="${c1}" stroke="${c2}" stroke-width="1.2"/>`;
      if (stage === 3) front += `<path d="M${cx - rx} ${cy + ry * .55} q8 -7 16 0 t16 0 t16 0 t16 0" stroke="#fff" stroke-width="3.5" fill="none" opacity=".85" stroke-linecap="round"/>`;
      break;
    case 'pebble':
      front += `<path d="M${cx - rx * .62} ${cy - ry * .25} L${cx - rx * .2} ${cy - ry * .78} L${cx + rx * .35} ${cy - ry * .72}" stroke="#fff" stroke-width="3" fill="none" opacity=".6" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (stage >= 2) front += `<ellipse cx="${cx - 7}" cy="${top + 2}" rx="8" ry="4" fill="#6CC46A"/><ellipse cx="${cx + 5}" cy="${top + 1}" rx="6" ry="3.5" fill="#86D97F"/>`;
      if (stage === 3) back += `<path d="M${cx} ${top - 26} L${cx + 9} ${top - 6} L${cx} ${top + 2} L${cx - 9} ${top - 6}Z" fill="#9FD8FF" stroke="#5AA9E6" stroke-width="2"/>`;
      break;
    case 'wisp':
      back += `<path d="M${cx + rx * .6} ${cy + ry * .4} Q${cx + rx + 22} ${cy + 4} ${cx + rx + 10} ${cy - 18} Q${cx + rx + 2} ${cy - 26} ${cx + rx - 4} ${cy - 14}" stroke="${c2}" stroke-width="${6 + stage}" fill="none" stroke-linecap="round" opacity=".75"/>`;
      front += `<path d="M${cx - 4} ${top + 2} Q${cx} ${top - 12} ${cx + 9} ${top - 8}" stroke="${c2}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      if (stage >= 2) back += `<path d="M${cx - rx * .6} ${cy + ry * .4} Q${cx - rx - 22} ${cy + 4} ${cx - rx - 10} ${cy - 18}" stroke="${c2}" stroke-width="${5 + stage}" fill="none" stroke-linecap="round" opacity=".55"/>`;
      if (stage === 3) front += `<path d="${star(cx - rx - 8, top - 4, 5)}" fill="#fff"/><path d="${star(cx + rx + 10, top + 10, 4)}" fill="#fff"/>`;
      break;
    case 'finch':
      back += `<ellipse cx="${cx - rx + 2}" cy="${cy + 4}" rx="9" ry="${13 + stage}" fill="${c2}" transform="rotate(28 ${cx - rx + 2} ${cy + 4})"/><ellipse cx="${cx + rx - 2}" cy="${cy + 4}" rx="9" ry="${13 + stage}" fill="${c2}" transform="rotate(-28 ${cx + rx - 2} ${cy + 4})"/>`;
      if (stage >= 2) back += `<path d="M${cx - 6} ${top + 4} Q${cx - 8} ${top - 12} ${cx} ${top - 16} Q${cx + 2} ${top - 6} ${cx + 4} ${top + 3}Z" fill="${c2}"/>`;
      if (stage === 3) back += `<path d="M${cx - 8} ${cy + ry - 4} L${cx - 22} ${cy + ry + 18} M${cx} ${cy + ry - 2} L${cx} ${cy + ry + 22} M${cx + 8} ${cy + ry - 4} L${cx + 22} ${cy + ry + 18}" stroke="${c2}" stroke-width="6" stroke-linecap="round"/>`;
      break;
    case 'lamp': {
      const eh = 14 + stage * 3;
      back += `<path d="M${cx - rx * .75} ${top + 10} L${cx - rx * .8} ${top - eh} L${cx - rx * .1} ${top + 3}Z" fill="${c2}"/><path d="M${cx + rx * .75} ${top + 10} L${cx + rx * .8} ${top - eh} L${cx + rx * .1} ${top + 3}Z" fill="${c2}"/>`;
      back += `<path d="M${cx + rx * .7} ${cy + ry * .5} Q${cx + rx + 20} ${cy + 10} ${cx + rx + 14} ${cy - 14}" stroke="${c2}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
      front += `<circle cx="${cx + rx + 14}" cy="${cy - 16}" r="${5 + stage * 2}" fill="#FFE27A" stroke="#fff" stroke-width="2"/>`;
      if (stage >= 2) back += `<circle cx="${cx + rx + 14}" cy="${cy - 16}" r="${12 + stage * 4}" fill="#FFE27A" opacity=".35"/>`;
      break;
    }
    case 'shore': {
      const sr = 11 + stage * 3;
      back += `<path d="M${cx - sr} ${top + 6} A${sr} ${sr} 0 0 1 ${cx + sr} ${top + 6}Z" fill="${c2}"/>`;
      for (let i = -2; i <= 2; i++) back += `<line x1="${cx}" y1="${top + 6}" x2="${cx + Math.sin(i * .6) * sr}" y2="${top + 6 - Math.cos(i * .6) * sr}" stroke="${c1}" stroke-width="1.6"/>`;
      if (stage === 3) front += `<circle cx="${cx}" cy="${top - sr + 4}" r="5" fill="#fff" stroke="#BFE9E2" stroke-width="2"/>`;
      if (stage >= 2) front += `<path d="M${cx - rx} ${cy + ry * .6} q7 -6 14 0 t14 0" stroke="#fff" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"/>`;
      break;
    }
  }
  const ex = 7 + stage * 2, ey = cy - 3;
  const eyes = `<g fill="#2A2340"><ellipse cx="${cx - ex}" cy="${ey}" rx="3.6" ry="4.6"/><ellipse cx="${cx + ex}" cy="${ey}" rx="3.6" ry="4.6"/></g><g fill="#fff"><circle cx="${cx - ex + 1.3}" cy="${ey - 1.8}" r="1.4"/><circle cx="${cx + ex + 1.3}" cy="${ey - 1.8}" r="1.4"/></g><g fill="#FF8FA3" opacity=".55"><ellipse cx="${cx - ex - 6}" cy="${ey + 7}" rx="4.2" ry="2.5"/><ellipse cx="${cx + ex + 6}" cy="${ey + 7}" rx="4.2" ry="2.5"/></g>`;
  const mouth = line === 'finch'
    ? `<path d="M${cx - 4} ${ey + 6} L${cx + 4} ${ey + 6} L${cx} ${ey + 11}Z" fill="#FFB020"/>`
    : `<path d="M${cx - 4} ${ey + 7} Q${cx} ${ey + 11} ${cx + 4} ${ey + 7}" stroke="#2A2340" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><radialGradient id="${id}" cx="38%" cy="32%" r="78%"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient><radialGradient id="${id}a"><stop offset="0" stop-color="${c1}" stop-opacity=".95"/><stop offset="1" stop-color="${c1}" stop-opacity="0"/></radialGradient></defs>${back}<ellipse cx="60" cy="${cy + ry + 5}" rx="${rx * .8}" ry="4" fill="#000" opacity=".1"/><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${F}"/><ellipse cx="${cx - rx * .35}" cy="${cy - ry * .45}" rx="${rx * .25}" ry="${ry * .16}" fill="#fff" opacity=".45"/>${front}${eyes}${mouth}</svg>`;
}
function spSVG(sp) { return sp ? lumiSVG(sp.line, sp.stage) : ''; }
$('#splashArt').innerHTML = lumiSVG('glim', 1);

/* ---------- invite / meet / transfer links ---------- */
(function captureLinks() {
  const q = new URLSearchParams(location.search), m = q.get('meet'), t = q.get('signin');
  if (m && /^[A-Za-z0-9]{5}$/.test(m)) lsSet('meet', m.toUpperCase());
  if (t && /^[A-Za-z0-9]{8}$/.test(t)) lsSet('signin', t.toUpperCase());
  if (m || t) history.replaceState(null, '', location.pathname);
})();
function meetUrl(code) { return location.origin + location.pathname + '?meet=' + code; }
function signinUrl(code) { return location.origin + location.pathname + '?signin=' + code; }

/* ---------- boot & data ---------- */
async function ensureSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) return session;
  const r = await sb.auth.signInAnonymously();
  if (r.error) throw r.error;
  return r.data.session;
}
async function boot() {
  if (!configured) {
    $('#splash').innerHTML = `<div style="padding:24px;max-width:420px"><div class="art">${lumiSVG('lamp', 2)}</div><h2 style="font-size:26px;margin:10px 0">Almost ready</h2><p style="opacity:.9">Open <b>index.html</b> and paste your Supabase URL and anon key at the top of the script.</p></div>`;
    return;
  }
  const pendingSignin = lsGet('signin');
  if (pendingSignin) {
    lsSet('signin', '');
    try {
      await ensureSession();
      const { data, error } = await sb.rpc('redeem_code', { p_code: pendingSignin });
      if (error) throw error;
      setTimeout(() => toast(`Welcome back, ${data.name}! 👋`, 3500), 600);
    } catch (e) { setTimeout(() => toast(errMsg(e), 4000), 600); }
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderJoin();
  const { data: who } = await sb.rpc('whoami');
  if (!who) return renderJoin();
  S.uid = who.id; S.me = who; S.username = who.username;
  await loadAll();
  $('#splash')?.remove();
  document.body.querySelector('.join')?.remove();
  ['#nav', '#hud', '#mapdock'].forEach(s => $(s).hidden = false);
  initMap();
  go(S.tab);
  startWatch();
  handlePendingMeet();
}

async function loadAll() {
  const uid = S.uid;
  const res = await Promise.all([
    sb.rpc('ward_home'),
    sb.from('quests').select('*').order('energy').order('xp'),
    sb.from('spots').select('*').order('name'),
    sb.from('species').select('*').order('id'),
    sb.from('dex').select('species_id,qty').eq('player_id', uid),
    sb.from('sparks').select('line,qty').eq('player_id', uid),
    sb.from('activity').select('id,kind,ref_id,title,path,xp,partner_id,created_at').eq('player_id', uid).order('created_at', { ascending: false }).limit(1000),
    sb.from('players').select('id,display_name,avatar,is_leader,ghost,xp,created_at').order('display_name'),
    sb.from('meets').select('a,b,met_on'),
    sb.from('kudos').select('*').eq('to_id', uid).order('created_at', { ascending: false }).limit(50),
    sb.from('encounters').select('id,species_id,source,created_at').eq('player_id', uid).eq('caught', false).order('created_at'),
    sb.from('events').select('id,title,description,place,starts_at,xp').gte('starts_at', new Date(Date.now() - 12 * 3600e3).toISOString()).order('starts_at').limit(30)
  ]);
  const err = res.find(r => r.error); if (err) toast(errMsg(err.error));
  [S.home, S.quests, S.spots, S.species, S.dex, S.sparks, S.acts, S.players, S.meets, S.inbox, S.pending, S.events] = res.map(r => r.data || []);
  if (Array.isArray(S.home)) S.home = null;
  S.me = S.players.find(p => p.id === uid) || S.me;
}

async function refresh() {
  await loadAll();
  drawSpots(); renderHUD(); renderDock(); navBadges();
  if (S.tab !== 'map') renderPage();
}

/* ---------- join / sign in (no email) ---------- */
const USER_RE = /^[a-z0-9_.]{3,20}$/, PIN_RE = /^[0-9]{4,6}$/;
function renderJoin(mode) {
  $('#splash')?.remove();
  document.body.querySelector('.join')?.remove();
  ['#nav', '#hud', '#mapdock', '#page'].forEach(s => $(s).hidden = true);
  const invite = lsGet('meet') || '';

  let av = AVATARS[Math.floor(Math.random() * AVATARS.length)], starter = 1;

  el.style.cssText = 'position:fixed;inset:0;overflow:auto;z-index:50';
  el.innerHTML = `<div class="wrap">
    <div class="center" style="color:#fff">
      <div style="width:104px;height:104px;margin:0 auto">${lumiSVG('glim', 2)}</div>
      <h1 style="font-size:40px;margin-top:2px">Lumins</h1>

        <button class="chip grow ${mode === 'back' ? 'on' : ''}" style="justify-content:center;border:0" data-mode="back">I've played before</button>

        ${invite ? `<div class="center b" style="background:#FFF5D6;border-radius:12px;padding:9px;margin-bottom:12px">🤝 A friend invited you — you'll link up automatically!</div>` : ''}
        <div class="label" style="margin-top:0">Pick your first Lumin</div>
        <div class="starter" id="jSt">${[[1, 'glim', 'Glim'], [4, 'seed', 'Seedle'], [7, 'drip', 'Driplet']].map(([id, L, nm]) => `<button data-s="${id}" class="${id === 1 ? 'on' : ''}"><div class="art">${lumiSVG(L, 1)}</div><div class="f" style="font-size:15px">${nm}</div><div class="tiny b" style="color:${LINES[L].c[1]}">${LINES[L].virtue.toUpperCase()}</div></button>`).join('')}</div>
        <div class="label">Your first name</div>
        <input id="jName" maxlength="40" placeholder="What friends call you" autocomplete="given-name">
        <div class="label">Pick a username & PIN <span style="text-transform:none;letter-spacing:0;font-family:Nunito">— to sign back in on any phone</span></div>
        <div class="row"><input id="jUser" maxlength="20" placeholder="username" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username"><input id="jPin" maxlength="6" inputmode="numeric" pattern="[0-9]*" type="password" placeholder="PIN" autocomplete="new-password" style="width:42%"></div>
        <div class="tiny muted b" style="margin-top:5px">PIN is 4–6 digits. Screenshot it or save it in your passwords — no email needed.</div>
        <div class="label">Avatar</div>
        <div class="avpick" id="jAv">${AVATARS.map(a => `<button data-a="${a}" class="${a === av ? 'on' : ''}">${a}</button>`).join('')}</div>
        <div class="label">Game code or a friend's code</div>
        <input id="jCode" value="${esc(invite)}" placeholder="Ask whoever invited you" autocapitalize="characters" style="text-transform:uppercase;font-weight:800;letter-spacing:.08em">
        <div style="height:16px"></div>
        <button class="btn" id="jGo">Let's go!</button>`
      : `
        <div class="label" style="margin-top:0">Username</div>
        <input id="lUser" maxlength="20" placeholder="username" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">
        <div class="label">PIN</div>
        <input id="lPin" maxlength="6" inputmode="numeric" pattern="[0-9]*" type="password" placeholder="••••" autocomplete="current-password">
        <div style="height:16px"></div>
        <button class="btn" id="lGo">Sign in</button>
        <div class="label">Forgot your PIN or got a sign-in code?</div>
        <div class="small muted" style="margin:-4px 0 8px">On your old phone: Me → Move to a new phone. Or ask a leader for a one-time code.</div>
        <div class="row"><input id="rCode" maxlength="9" placeholder="ABCD-EFGH" autocapitalize="characters" style="text-transform:uppercase;font-weight:800;letter-spacing:.1em"><button class="btn sm gold" id="rGo">Use code</button></div>`}
    </div>
  </div>`;
  document.body.appendChild(el);

  const enter = async (btn, label, fn) => {
    btn.disabled = true; btn.textContent = 'One sec…';

    catch (e) { toast(errMsg(e), 3800); btn.disabled = false; btn.textContent = label; }

    $('#jAv').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; av = b.dataset.a; [...$('#jAv').children].forEach(x => x.classList.toggle('on', x === b)); };

      });
    };
  } else {
    $('#lGo').onclick = () => {
      const user = $('#lUser').value.trim(), pin = $('#lPin').value.trim();
      if (!user || !pin) return toast('Enter your username and PIN');
      enter($('#lGo'), 'Sign in', async () => {
        const { data, error } = await sb.rpc('login', { p_username: user, p_pin: pin });
        if (error) throw error;
        if (!data.ok) throw new Error(data.error);
        setTimeout(() => toast(`Welcome back, ${data.name}! 👋`, 3000), 600);
      });
    };
    $('#rGo').onclick = () => {
      const code = $('#rCode').value.trim(); if (!code) return toast('Enter the code');
      enter($('#rGo'), 'Use code', async () => {
        const { data, error } = await sb.rpc('redeem_code', { p_code: code });
        if (error) throw error;
        setTimeout(() => toast(`Welcome back, ${data.name}! Set a new PIN under Me 🔒`, 4200), 600);
      });
    };
  }
}

/* ---------- navigation ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.tab));
function go(tab) {
  S.tab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const onMap = tab === 'map';
  $('#page').hidden = onMap; $('#hud').hidden = !onMap; $('#mapdock').hidden = !onMap;
  if (onMap) { renderHUD(); renderDock(); setTimeout(() => S.map && S.map.invalidateSize(), 50); }
  else { renderPage(); $('#page').scrollTop = 0; }
  navBadges();
}
function renderPage() { ({ quests: renderQuests, crew: renderCrew, dex: renderDex, me: renderMe })[S.tab](); }
function navBadges() {
  const set = (tab, n) => { const b = document.querySelector(`nav [data-tab="${tab}"]`); b.querySelector('em')?.remove(); if (n) b.insertAdjacentHTML('beforeend', `<em>${n}</em>`); };
  set('map', S.pending.length);
  set('crew', S.inbox.filter(k => !k.seen).length);
  set('dex', S.species.filter(s => s.stage < 3 && owned(s.id) && sparksFor(s.line) >= growCost(s)).length ? '↑' : 0);
}

/* ---------- map ---------- */
function initMap() {
  if (S.map) { drawSpots(); return; }
  const c = (S.home && S.home.center) || [43.7508, -87.7145];
  S.map = L.map('map', { zoomControl: false, attributionControl: true }).setView(c, 14);
  // OpenStreetMap tiles: free, no API key (attribution required)
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19, className: 'osm-tiles'
  }).addTo(S.map);
  S.layer = L.layerGroup().addTo(S.map);
  S.map.on('click', e => { if (S.addSpot) addSpotSheet(e.latlng); });
  drawSpots();
}
function drawSpots() {
  if (!S.layer) return;
  S.layer.clearLayers();
  const visited = new Set((S.home && S.home.visited) || []);
  S.spots.filter(s => s.is_active).forEach(s => {
    const k = KINDS[s.kind] || KINDS.gather;
    const icon = L.divIcon({ className: '', html: `<div class="pin ${visited.has(s.id) ? 'done' : ''}" style="--kc:${k.c}"><span>${esc(s.icon)}</span></div>`, iconSize: [46, 46], iconAnchor: [4, 46] });
    L.marker([s.lat, s.lng], { icon }).addTo(S.layer).on('click', () => spotSheet(s));
  });
}
function startWatch() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(p => {
    S.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    if (!S.map) return;
    if (!S.meMarker) S.meMarker = L.marker([S.pos.lat, S.pos.lng], { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }), zIndexOffset: 1000 }).addTo(S.map);
    else S.meMarker.setLatLng([S.pos.lat, S.pos.lng]);
  }, () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
}
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Location isn\'t available on this device'));
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      e => rej(new Error(e.code === 1 ? 'Turn on location for this site to check in' : 'Couldn\'t find you — try again outside')),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 15000 });
  });
}
function renderHUD() {
  if (!S.home || !S.me) return;
  const L2 = levelInfo(S.me.xp), b = S.home.beacon || { goal: 40 }, pct = Math.min(100, Math.round(S.home.light / b.goal * 100));
  $('#hud').innerHTML = `
    <button class="hudcard" onclick="go('me')"><div class="ava s">${esc(S.me.avatar)}</div><div style="text-align:left"><div class="lvchip">LV ${L2.lv} · ${L2.title.toUpperCase()}</div><div class="bar blue" style="width:92px;height:6px;margin-top:3px"><i style="width:${L2.pct}%"></i></div></div></button>
    <button class="beaconpill" id="hudBeacon">🔥 <span>${S.home.light}/${b.goal}</span><div class="bar"><i style="width:${pct}%"></i></div></button>`;
  $('#hudBeacon').onclick = beaconSheet;
}
function renderDock() {
  if (!S.home) return;
  const n = S.pending.length, first = n && species(S.pending[0].species_id);
  const todayEv = S.events.filter(e => Math.abs(new Date(e.starts_at) - Date.now()) < 12 * 3600e3).length;
  $('#mapdock').innerHTML = `
    ${S.addSpot ? `<div class="leaderbanner">Tap the map where the new spot goes · <u id="cancelAdd">cancel</u></div>` : ''}
    <div class="fabs">
      ${S.me.is_leader ? `<button class="fab ${S.addSpot ? 'on' : ''}" id="fAdd" title="Add spot">➕</button>` : ''}
      <button class="fab" id="fEv" title="Happenings">📅${todayEv ? `<em>${todayEv}</em>` : ''}</button>
      <button class="fab" id="fMeet" title="Link up">🤝</button>
      <button class="fab" id="fLoc" title="Find me">🎯</button>
    </div>
    ${n ? `<button class="waiting" id="fWait"><div class="mini">${spSVG(first)}</div><div style="text-align:left">${n === 1 ? 'A Lumin is waiting!' : n + ' Lumins are waiting!'}<div class="small" style="font-family:Nunito;font-weight:800;opacity:.75">Tap to catch</div></div></button>` : ''}`;
  $('#fEv').onclick = eventsSheet;
  $('#fMeet').onclick = meetSheet;
  $('#fLoc').onclick = async () => { try { const p = S.pos || await getPos(); S.map.setView([p.lat, p.lng], 16); } catch (e) { toast(errMsg(e)); } };
  if ($('#fAdd')) $('#fAdd').onclick = () => { S.addSpot = !S.addSpot; renderDock(); };
  if ($('#cancelAdd')) $('#cancelAdd').onclick = () => { S.addSpot = false; renderDock(); };

function spotSheet(s) {
  const k = KINDS[s.kind] || KINDS.gather;
  const done = ((S.home && S.home.visited) || []).includes(s.id);
  const ever = S.acts.some(a => a.kind === 'visit' && a.ref_id === s.id);
  const d = S.pos ? distM(S.pos, s) : null;
  openSheet(`
    <div class="row"><div style="width:60px;height:60px;border-radius:18px;background:${k.c}22;display:grid;place-items:center;font-size:32px">${esc(s.icon)}</div>
      <div class="grow"><div class="tiny b" style="color:${k.c};letter-spacing:.08em">${k.n.toUpperCase()}</div><h2 style="font-size:23px">${esc(s.name)}</h2>
      <div class="small muted">${d != null ? fmtDist(d) + ' away' : 'Location off'}${ever ? '' : ' · <b style="color:var(--coral)">New spot! +25 bonus</b>'}</div></div></div>
    <p class="muted">${esc(s.description)}</p>
    <div class="panel" style="background:var(--paper);box-shadow:none;padding:12px"><div class="small"><b>Check in here</b> for +${ever ? 15 : 40} XP and a Lumin. ${s.kind === 'lake' ? 'Water-type Lumins love the lakeshore.' : s.kind === 'quiet' ? 'Quiet spots attract rare, peaceful Lumins.' : s.kind === 'park' ? 'Leafy and feathery Lumins hang out in parks.' : 'Busy places attract friendly Lumins.'}</div></div>
    ${done ? `<div class="btn ghost center">✓ Checked in today — back tomorrow</div>` : `<button class="btn" id="ciGo">📍 I'm here — check in</button>`}
    <a class="btn ghost" style="margin-top:10px;text-decoration:none;text-align:center" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">Directions</a>
    ${S.me.is_leader ? `<button class="btn ghost sm" style="margin-top:12px" id="spHide">Hide this spot</button>` : ''}`);
  if ($('#ciGo')) $('#ciGo').onclick = async () => {
    const btn = $('#ciGo'); btn.disabled = true; btn.textContent = 'Finding you…';
    try {
      const p = await getPos();
      const { data, error } = await sb.rpc('visit_spot', { p_spot: s.id, p_lat: p.lat, p_lng: p.lng });
      if (error) throw error;
      closeSheet();
      toast(`+${data.xp} XP${data.first ? ' · First visit bonus!' : ''}`);
      await refresh();
      startCatch(data.encounter);
    } catch (e) { toast(errMsg(e), 3800); btn.disabled = false; btn.textContent = "📍 I'm here — check in"; }
  };
  if ($('#spHide')) $('#spHide').onclick = async () => {
    const { error } = await sb.from('spots').update({ is_active: false }).eq('id', s.id);
    if (error) return toast(errMsg(error));
    closeSheet(); toast('Spot hidden'); refresh();
  };
}

/* ---------- catching ---------- */
function catchNext() { const p = S.pending[0]; if (p) startCatch({ id: p.id, species: species(p.species_id) }); }
function startCatch(enc) {
  if (!enc || !enc.species) return;
  if (!S.pending.some(p => p.id === enc.id)) S.pending.push({ id: enc.id, species_id: enc.species.id });
  const sp = enc.species, [c1, c2] = LINES[sp.line].c;
  const el = $('#catch');
  el.style.setProperty('--cb1', c1); el.style.setProperty('--cb2', c2);
  el.innerHTML = `
    <div class="ctop"><span>${sp.stage === 3 ? '🌟 A legendary Lumin appeared!' : sp.stage === 2 ? '✨ A rare Lumin appeared!' : 'A wild Lumin appeared!'}</span><button class="cx" id="cX">✕</button></div>
    <div style="text-align:center"><div class="cname">${esc(sp.name)}</div><div class="cstars">${'★'.repeat(sp.stage)}${'☆'.repeat(3 - sp.stage)} · ${esc(sp.virtue)}</div></div>
    <div class="cstage" id="cStage"><div class="cmon" id="cMon">${spSVG(sp)}</div><div class="cring" id="cRing"></div><div class="corb" id="cOrb"></div></div>
    <div class="cthrow"><button class="btn gold" id="cThrow">Tap when the ring is small!</button><p class="center small b" style="color:#fff;opacity:.85;margin:10px 0 0">Smaller ring = better catch = more sparks</p></div>`;
  el.classList.add('open');
  const ring = $('#cRing'); let raf, scale = 1, thrown = false; const t0 = performance.now();
  const loop = t => { const p = ((t - t0) % 1500) / 1500; scale = 1 - .74 * p; ring.style.transform = `translate(-50%,-50%) scale(${scale})`; ring.style.borderColor = scale < .45 ? '#3BE08A' : scale < .7 ? '#FFD84A' : '#fff'; raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
  const close = () => { cancelAnimationFrame(raf); el.classList.remove('open'); el.innerHTML = ''; renderDock(); navBadges(); };
  $('#cX').onclick = () => { close(); if (!thrown) toast("It'll wait for you on the map ✨"); };
  const throwIt = async () => {
    if (thrown) return; thrown = true; cancelAnimationFrame(raf);
    const q = scale < .45 ? 2 : scale < .7 ? 1 : 0;
    $('#cThrow').disabled = true; ring.style.opacity = '0';
    const req = sb.rpc('catch_lumin', { p_enc: enc.id, p_quality: q });
    $('#cOrb').classList.add('fly');
    await wait(420); $('#cMon').classList.add('in');
    $('#cStage').insertAdjacentHTML('beforeend', `<div class="chit">${QUALITY[q]}</div>`);
    await wait(380); $('#cOrb').classList.add('wob');
    const [{ data, error }] = await Promise.all([req, wait(1800)]);
    if (error) { toast(errMsg(error)); S.pending = S.pending.filter(p => p.id !== enc.id); return close(); }
    $('#cOrb').classList.add('burst'); confetti(sp.stage > 1 ? 50 : 22);
    S.pending = S.pending.filter(p => p.id !== enc.id);
    const d = S.dex.find(x => x.species_id === sp.id); if (d) d.qty++; else S.dex.push({ species_id: sp.id, qty: 1 });
    const k = S.sparks.find(x => x.line === sp.line); if (k) k.qty = data.sparks_total; else S.sparks.push({ line: sp.line, qty: data.sparks_total });
    S.me.xp += data.xp;
    await wait(300);
    const more = S.pending.length;
    el.querySelector('.cthrow').remove(); $('#cStage').remove();
    el.insertAdjacentHTML('beforeend', `<div class="result"><div class="art">${spSVG(sp)}</div>
      ${data.new ? '<div class="newtag">NEW! Added to your Lumidex</div>' : ''}
      <h2 style="font-size:26px">${esc(sp.name)} caught!</h2>
      <div class="virtue" style="--lc:${c2};margin:2px 0 8px">${esc(sp.virtue)}</div>
      <p class="muted" style="margin:0 0 12px;font-style:italic">“${esc(sp.flavor)}”</p>
      <div class="row" style="justify-content:center;gap:8px;margin-bottom:14px"><span class="sparkpill">+${data.sparks} ✦ sparks</span><span class="sparkpill" style="background:#EAF2FF;color:var(--blue)">+${data.xp} XP</span></div>
      ${more ? `<button class="btn gold" id="cNext">Next Lumin (${more} waiting)</button><div style="height:8px"></div>` : ''}
      <button class="btn ${more ? 'ghost' : ''}" id="cDone">${more ? 'Later' : 'Awesome!'}</button></div>`);
    $('#cDone').onclick = () => { close(); if (S.tab !== 'map') renderPage(); else renderHUD(); };
    if ($('#cNext')) $('#cNext').onclick = () => { close(); catchNext(); };
  };
  $('#cThrow').onclick = throwIt; $('#cStage').onclick = throwIt;
}

/* ---------- photos ---------- */
function compress(file, max = 1280) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      let w = im.naturalWidth, h = im.naturalHeight; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read that photo')), 'image/jpeg', .82);
    };
    im.onerror = () => rej(new Error('Could not read that photo'));
    im.src = url;
  });
}
async function uploadPhoto(file) {
  const blob = await compress(file);
  const path = `${S.uid}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
  const { error } = await sb.storage.from('ysa-photos').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw error;
  return path;
}
function photoPicker(id) {
  return `<label class="photopick" id="${id}L"><input type="file" accept="image/*" id="${id}" hidden><img alt=""><span class="small b">📷 Add a photo <span class="muted">(optional)</span></span></label>`;
}
function bindPhoto(id) {
  const inp = $('#' + id); if (!inp) return;
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const lab = $('#' + id + 'L'); lab.classList.add('has'); lab.querySelector('img').src = URL.createObjectURL(f); lab.querySelector('span').innerHTML = 'Photo ready ✓ <span class="muted">(tap to change)</span>'; };
}
const urlCache = {};
async function fillPhotos(root) {
  const imgs = [...root.querySelectorAll('img[data-path]')]; if (!imgs.length) return;
  const need = [...new Set(imgs.map(i => i.dataset.path).filter(p => !urlCache[p]))];
  if (need.length) { const { data } = await sb.storage.from('ysa-photos').createSignedUrls(need, 3600); (data || []).forEach(d => { if (d.signedUrl) urlCache[d.path] = d.signedUrl; }); }
  imgs.forEach(i => { if (urlCache[i.dataset.path]) i.src = urlCache[i.dataset.path]; });
}

function questStatus(q) {
  if (!q.cooldown_days) return { ok: true };
  const last = S.acts.find(a => a.kind === 'quest' && a.ref_id === q.id); if (!last) return { ok: true };
  const left = q.cooldown_days - (dnum(S.home.today) - dnum(localDate(last.created_at)));
  return left > 0 ? { ok: false, left } : { ok: true };
}
function isDaily(q) { return (S.home.daily || []).includes(q.id); }
function questRow(q) {
  const st = questStatus(q), d = isDaily(q), xp = q.xp + (d ? Math.floor(q.xp / 2) : 0);

/* ---------- lumidex ---------- */
function growCost(s) { return s.stage === 1 ? 10 : 25; }
function renderDex() {
  const have = S.dex.length;
  $('#pageBody').innerHTML = `
    <div class="pagehead"><h1>Lumidex</h1><span class="f" style="color:var(--blue);font-size:18px">${have}/${S.species.length}</span></div>
    <p class="muted small" style="margin:0 0 6px">Catch Lumins to earn ✦ sparks. Spend sparks to help them grow.</p>
    <div class="bar blue" style="margin-bottom:16px"><i style="width:${Math.round(have / Math.max(1, S.species.length) * 100)}%"></i></div>
    ${LINE_ORDER.map(line => {
      const row = S.species.filter(s => s.line === line).sort((a, b) => a.stage - b.stage), c2 = LINES[line].c[1];
      return `<div class="lineblock" style="--lc:${c2}"><div class="row between"><div><div class="virtue">${esc(LINES[line].virtue)}</div><div class="f" style="font-size:17px">${esc(row[0] ? row[0].name : '')} family</div></div><span class="sparkpill">✦ ${sparksFor(line)}</span></div>
        <div class="dexrow">${row.map(s => { const q = owned(s.id), canGrow = q && s.stage < 3 && sparksFor(line) >= growCost(s);
          return `<button class="mon ${q ? '' : 'sil'}" data-sp="${s.id}">${q > 1 ? `<span class="qty">×${q}</span>` : ''}<div class="art">${spSVG(s)}</div><div class="nm">${q ? esc(s.name) : '???'}</div>${canGrow ? '<span class="grow-btn">GROW ↑</span>' : ''}</button>`; }).join('')}</div></div>`;
    }).join('')}`;
  document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => monSheet(+b.dataset.sp));
}
function monSheet(id) {
  const s = species(id), q = owned(id), c2 = LINES[s.line].c[1], next = S.species.find(x => x.line === s.line && x.stage === s.stage + 1);
  if (!q) { openSheet(`<div class="center"><div class="mon sil" style="width:160px;margin:0 auto;background:none"><div class="art">${spSVG(s)}</div></div><h2>???</h2><p class="muted">${s.stage === 1 ? 'Keep exploring — it\'s out there somewhere.' : 'Grow its earlier form to discover it, or get lucky and catch one in the wild.'}</p></div>`); return; }
  const cost = growCost(s), sp = sparksFor(s.line);
  openSheet(`<div class="center" style="--lc:${c2}"><div style="width:180px;height:180px;margin:-10px auto 0">${spSVG(s)}</div>
    <div class="virtue">${esc(s.virtue)} · ${'★'.repeat(s.stage)}${'☆'.repeat(3 - s.stage)}</div><h2 style="font-size:28px">${esc(s.name)}</h2>
    <p class="muted" style="font-style:italic">“${esc(s.flavor)}”</p>
    <div class="row" style="justify-content:center;gap:8px"><span class="sparkpill">✦ ${sp} sparks</span><span class="sparkpill" style="background:var(--paper);color:var(--ink)">Caught ×${q}</span></div></div>
    <div style="height:14px"></div>
    ${next ? `<button class="btn ${sp >= cost ? '' : 'ghost'}" id="grow" ${sp >= cost ? '' : 'disabled'}>${sp >= cost ? `🌱 Grow into ${owned(next.id) ? esc(next.name) : '???'} (${cost} ✦)` : `Need ${cost - sp} more ✦ to grow`}</button>` : `<div class="center f" style="color:${c2}">Fully grown 🌟</div>`}`);
  if ($('#grow')) $('#grow').onclick = async () => {
    const { data, error } = await sb.rpc('evolve', { p_species: id });
    if (error) return toast(errMsg(error));
    const nx = data.species;
    openSheet(`<div class="center"><div style="width:200px;height:200px;margin:0 auto;animation:pop .7s">${spSVG(nx)}</div>${data.new ? '<div class="newtag">NEW!</div>' : ''}<h2 style="font-size:26px">${esc(s.name)} grew into ${esc(nx.name)}!</h2><p class="muted" style="font-style:italic">“${esc(nx.flavor)}”</p><button class="btn" onclick="closeSheet()">Amazing!</button></div>`);
    confetti(50);
    await refresh();
  };
}

/* ---------- me ---------- */
function streak() {
  const weeks = new Set(S.acts.filter(a => a.kind !== 'join').map(a => weekStart(localDate(a.created_at))));
  let w = S.home.week_start; if (!weeks.has(w)) w = shiftWeek(w, -1);
  let n = 0; while (weeks.has(w)) { n++; w = shiftWeek(w, -1); } return n;
}
function badges() {
  const a = S.acts, k = t => a.filter(x => x.kind === t), qp = p => a.filter(x => x.kind === 'quest' && x.path === p).length;
  const spots = new Set(k('visit').map(x => x.ref_id)).size, fr = friends();
  return [
    { e: '👣', n: 'First Steps', on: a.some(x => x.kind !== 'join'), how: 'Do anything!' },
    { e: '📍', n: 'Explorer', on: spots >= 5, how: 'Check in at 5 different spots' },
    { e: '🗺️', n: 'Local Legend', on: k('visit').length >= 25, how: '25 check-ins' },
    { e: '🤝', n: 'New Friend', on: fr.length >= 1, how: 'Link up with someone' },
    { e: '🦋', n: 'Social Butterfly', on: fr.length >= 10, how: '10 different friends' },
    { e: '💞', n: 'Good Friends', on: fr.some(f => f.days >= 7), how: 'Hang out with someone on 7 days' },
    { e: '🔎', n: 'Hunter', on: k('hunt').length >= 5, how: '5 crew hunt finds' },
    { e: '🤲', n: 'Helping Hand', on: qp('serve') >= 5, how: '5 Serve quests' },
    { e: '🌙', n: 'Deep Thinker', on: qp('reflect') >= 10, how: '10 Reflect quests' },
    { e: '📅', n: 'Showed Up', on: k('event').length >= 3, how: 'Check in at 3 happenings' },
    { e: '🎉', n: 'Recruiter', on: k('recruit').length >= 1, how: 'Invite someone who joins' },
    { e: '🔥', n: 'On a Roll', on: streak() >= 4, how: '4-week streak' },
    { e: '📖', n: 'Collector', on: S.dex.length >= 12, how: '12 different Lumins' },
    { e: '🌟', n: 'Fully Grown', on: S.dex.some(d => (species(d.species_id) || {}).stage === 3), how: 'Own a 3-star Lumin' },
    { e: '🍽️', n: 'Supper Club', on: a.some(x => /supper club/i.test(x.title)), how: 'Dinner with a ward family' },
    { e: '🛠️', n: 'JustServe', on: a.some(x => /justserve/i.test(x.title)), how: 'Do a JustServe project' }
  ];
}

  $('#sSave').onclick = async () => {
    const { error } = await sb.from('settings').update({ ward_name: $('#sWard').value.trim(), join_code: $('#sJoin').value.trim(), leader_code: $('#sLead').value.trim(), checkin_radius_m: Math.max(25, +$('#sRad').value || 200) }).eq('id', 1);
    if (error) return toast(errMsg(error)); toast('Saved ✓'); refresh();
  };
}

boot();
</script>
</body>
